name: Website

# Publishes site/ to GitHub Pages whenever the production branch changes.
# site/build.sh copies in the pieces of the real app the site reuses (renderer,
# recorded run, and the interface itself for the live demo).
on:
  push:
    branches: [production]
    paths:
      - 'site/**'
      - 'ui/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: bash site/build.sh
      - name: Cache-bust the page's own assets
        run: |
          v=${GITHUB_SHA::7}
          sed -i "s|css/site.css\"|css/site.css?v=$v\"|; s|js/site.js\"|js/site.js?v=$v\"|; s|js/demo.js\"|js/demo.js?v=$v\"|; s|js/art.js\"|js/art.js?v=$v\"|" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
