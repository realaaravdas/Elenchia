[package]
name = "elenchia"
version = "1.2.0-experimental"
description = "Elenchia - direct an AI research lab. Local models only."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
pdf-extract = "0.7"
rfd = "0.15"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
